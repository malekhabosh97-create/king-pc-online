name: Windows - RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Windows Remote Desktop
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install RustDesk
        shell: powershell
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/rustdesk/rustdesk/releases/latest"
          $asset = $release.assets | Where-Object {
            $_.name -match "x86_64\.exe$"
          } | Select-Object -First 1

          if (-not $asset) {
            throw "RustDesk Windows x64 installer not found."
          }

          Write-Host "Downloading: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:TEMP\rustdesk.exe"
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--silent-install" -Wait
          Start-Sleep -Seconds 15

      - name: Start RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rustdesk)) {
            throw "RustDesk installation failed."
          }

          Start-Process $rustdesk
          Start-Sleep -Seconds 15
          & $rustdesk --password "Malek2026RD" | Out-String
          Start-Sleep -Seconds 5
          $id = (& $rustdesk --get-id | Out-String).Trim()

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK IS READY"
          Write-Host "ID: $id"
          Write-Host "PASSWORD: Malek2026RD"
          Write-Host "======================================"
          Write-Host ""

      - name: Check RustDesk
        shell: powershell
        run: |
          Get-Process rustdesk -ErrorAction SilentlyContinue
          Get-Service | Where-Object {
            $_.Name -like "*rustdesk*"
          } | Format-Table -AutoSize

      - name: Time Counter
        shell: powershell
        run: |
          Write-Host "Windows runner is online."
          while ($true) {
            Write-Host "$(Get-Date) - Runner Online"
            Start-Sleep -Seconds 60
          }
