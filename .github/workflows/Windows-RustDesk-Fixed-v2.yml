name: Windows - RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download RustDesk
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "Downloading RustDesk MSI..."

          gh release download 1.4.9 `
            --repo rustdesk/rustdesk `
            --pattern "rustdesk-1.4.9-x86_64.msi" `
            --dir "$env:TEMP" `
            --clobber

          $msi = "$env:TEMP\rustdesk-1.4.9-x86_64.msi"

          if (!(Test-Path $msi)) {
            throw "RustDesk MSI download failed."
          }

          Write-Host "Download complete."
          Write-Host "File size: $((Get-Item $msi).Length)"

      - name: Install RustDesk
        shell: powershell
        run: |
          $msi = "$env:TEMP\rustdesk-1.4.9-x86_64.msi"

          Write-Host "Installing RustDesk..."

          $p = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0) {
            throw "RustDesk installation failed."
          }

          Write-Host "RustDesk installed successfully."

      - name: Configure RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
            throw "RustDesk executable not found."
          }

          Write-Host "Starting RustDesk service..."

          & $rustdesk --install-service
          Start-Sleep -Seconds 10

          $password = "Malek2026RD"

          & $rustdesk --password $password

          Start-Process $rustdesk
          Start-Sleep -Seconds 15

          Write-Host "Waiting for RustDesk ID..."

          $id = ""

          for ($i = 1; $i -le 12; $i++) {

            $id = (& $rustdesk --get-id | Out-String).Trim()

            if ($id) {
              break
            }

            Write-Host "Waiting for ID... $i/12"
            Start-Sleep -Seconds 5
          }

          if (!$id) {
            throw "Could not get RustDesk ID."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RUSTDESK READY"
          Write-Host "ID: $id"
          Write-Host "PASSWORD: $password"
          Write-Host "======================================"
          Write-Host ""

      - name: Time Counter
        shell: powershell
        run: |
          Write-Host "Runner is online."

          while ($true) {
            Write-Host "$(Get-Date) - ONLINE"
            Start-Sleep -Seconds 60
          }
