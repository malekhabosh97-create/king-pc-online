name: Windows - RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download & Install RustDesk
        shell: powershell
        run: |
          Write-Host "Downloading RustDesk..."

          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-x86_64.exe" `
            -OutFile "$env:TEMP\rustdesk.exe"

          Write-Host "Download complete."

          Start-Process `
            -FilePath "$env:TEMP\rustdesk.exe" `
            -ArgumentList "--silent-install" `
            -Wait

          Start-Sleep -Seconds 10

          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdesk)) {
            throw "RustDesk was not installed."
          }

          Write-Host "RustDesk installed."

      - name: Configure RustDesk
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          Start-Process $rustdesk
          Start-Sleep -Seconds 10

          & $rustdesk --password "Malek2026RD" | Out-String

          Start-Sleep -Seconds 5

          $id = (& $rustdesk --get-id | Out-String).Trim()

          Write-Host ""
          Write-Host "==============================="
          Write-Host "RUSTDESK READY"
          Write-Host "ID: $id"
          Write-Host "PASSWORD: Malek2026RD"
          Write-Host "==============================="
          Write-Host ""

      - name: Time Counter
        shell: powershell
        run: |
          while ($true) {
            Write-Host "$(Get-Date) - Runner Online"
            Start-Sleep -Seconds 60
          }
