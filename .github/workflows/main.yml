steps:
  - name: Download RustDesk
    shell: powershell
    run: |
      Write-Host "Downloading RustDesk..."
      $url = "https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-x86_64.exe"
      $outFile = "$env:TEMP\rustdesk.exe"
      for ($i=1; $i -le 5; $i++) {
        try {
          Invoke-WebRequest -Uri $url -OutFile $outFile -UseBasicParsing -UserAgent "Mozilla/5.0"
          Write-Host "Downloaded."
          break
        } catch {
          Write-Warning "Retry $i - Error: $_"
          Start-Sleep -Seconds 10
          if ($i -eq 5) { throw "Download failed after 5 retries." }
        }
      }
      if (!(Test-Path $outFile)) { exit 1 }

  - name: Install RustDesk
    shell: powershell
    run: |
      Write-Host "Installing..."
      Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "/S" -Wait
      Start-Sleep -Seconds 15
      $path = "C:\Program Files\RustDesk\rustdesk.exe"
      if (!(Test-Path $path)) { throw "Installation failed" }
      Write-Host "Installed successfully."

  # باقي الخطوات (Start, Get ID, Time Counter) تبقى كما هي،
  # فقط زد عدد المحاولات في البحث عن ID إلى 20.
